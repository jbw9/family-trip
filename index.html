<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Trip">
    <meta name="robots" content="noindex">
    <title>Family Trip</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <aside class="side" id="side"></aside>
        <main id="main" class="main"></main>
        <aside class="panel" id="panel"></aside>
    </div>
    <nav class="tabs" id="tabs">
        <a href="#today" data-tab="today"><span class="ti">◉</span>Today</a>
        <a href="#days" data-tab="days"><span class="ti">☰</span>Days</a>
        <a href="#places" data-tab="places"><span class="ti">⌖</span>Places</a>
        <a href="#bookings" data-tab="bookings"><span class="ti">✓</span>Bookings<b id="tobook-badge" hidden></b></a>
    </nav>
    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script src="app.js"></script>
    <script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
